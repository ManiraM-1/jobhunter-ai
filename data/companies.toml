# Companies whose public job boards /scrape searches directly.
#
# Every entry here was checked against the live board feed and had open roles
# in India on the date in `verified`. Boards move (a company switches ATS or
# renames its board), so `python tools/ats_search.py check` re-verifies the list.
#
# Add your own targets with /add-company, or by hand:
#   python tools/ats_search.py discover "Company Name"
# then paste the [[company]] block it prints.
#
# ats:  greenhouse | lever | ashby
# slug: the board name in the URL, e.g. jobs.lever.co/<slug>

